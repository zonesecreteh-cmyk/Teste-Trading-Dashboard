<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0c10;
    --card: #141720;
    --bd: #1f232e;
    --text: #e6e8ea;
    --muted: #8b949e;
    --muted2: #30363d;
    --green: #00ff87;
    --red: #ff3860;
    --orange: #ff9f1c;
    --blue: #00d2ff;
    --navy: #182535;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 24px;
    font-size:14.5px;
  }
  .topbar-container {
    background: var(--card);
    border: 1px solid var(--bd);
    border-radius: 12px;
    padding: 14px 20px;
    margin-bottom: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .category-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .category-toggle {
    display: inline-flex;
    background: #0b0c10;
    border: 1px solid var(--bd);
    padding: 3px;
    border-radius: 8px;
    gap: 4px;
  }
  .cat-btn {
    padding: 6px 14px;
    border-radius: 6px;
    font-size:12.5px;
    font-weight: 700;
    cursor: pointer;
    color: var(--muted);
    transition: all .2s;
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  .cat-btn:hover { color: var(--text); }
  .cat-btn.active {
    background: var(--blue);
    color: #fff;
  }
  .market-status {
    padding: 5px 12px;
    border-radius: 6px;
    font-size:11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .8px;
    display: inline-flex;
    align-items: center;
  }
  .market-status.open {
    border: 1px solid var(--green);
    color: var(--green);
    background: rgba(0, 255, 135, 0.05);
  }
  .market-status.closed {
    border: 1px solid var(--red);
    color: var(--red);
    background: rgba(255, 56, 96, 0.05);
  }
  .asset-row {
    display: flex;
    align-items: center;
    gap: 12px;
    border-top: 1px solid var(--bd);
    padding-top: 12px;
  }
  .asset-label {
    font-size:11.5px;
    color: var(--muted);
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .assets {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .ab {
    padding: 7px 13px;
    border-radius: 9px;
    cursor: pointer;
    background: rgba(255,255,255,.01);
    border: 1px solid var(--bd);
    font-weight: 600;
    transition: all .2s;
    display: flex;
    align-items: center;
    gap: 7px;
    font-size:14px;
    color: var(--muted);
  }
  .ab:hover { background: rgba(255,255,255,.04); border-color: #2c3650; color: var(--text); }
  .ab.on {
    border-color: #f5a623;
    color: var(--text);
    background: #141925;
  }
  .asset-ic-circle{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;
    font-size:12.5px;font-weight:800;color:#0a0c11;flex:0 0 auto;}
  .topbar-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .refresh { cursor: pointer; color: var(--muted); font-size:13.5px; transition: color .2s; }
  .refresh:hover { color: var(--text); }
  .stamp { color: var(--muted); font-size:12.5px; }

  /* nav sub-tabs */
  .subnav {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .subnav-btn {
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid var(--bd);
    background: rgba(255,255,255,.01);
    font-size:12.5px;
    font-weight: 600;
    letter-spacing: .5px;
    text-transform: uppercase;
    cursor: pointer;
    color: var(--muted);
    transition: all .2s;
  }
  .subnav-btn:hover { background: rgba(255,255,255,.04); border-color: #353945; color: var(--text); }
  .subnav-btn.active { background: var(--bd); border-color: #484f58; color: var(--text); }

  /* layout */
  .verdict {
    background: var(--card);
    border: 1px solid var(--bd);
    border-radius: 12px;
    padding: 20px 24px;
    display: flex;
    align-items: center;
    gap: 32px;
    flex-wrap: wrap;
    margin-bottom: 20px;
    position: relative;
    width: 100%;
  }
  .vmeta-group { display: flex; align-items: center; gap: 24px; }
  .vmeta { display: flex; flex-direction: column; gap: 4px; }
  .vmeta .l { font-size:11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; font-weight: 600; }

  /* Synthesis Horizontal Convergence Engine card */
  .conv {
    background: var(--card);
    border: 1px solid var(--bd);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 20px;
    width: 100%;
  }
  .synthesis-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 1px solid var(--bd);
    padding-bottom: 12px;
    margin-bottom: 16px;
  }
  .synthesis-header h2 { font-size:14.5px; font-weight: 700; letter-spacing: 0.8px; color: var(--text); text-transform: uppercase; }
  .synthesis-header .subtitle { font-size:12.5px; color: var(--muted); margin-top: 4px; }
  .synthesis-header .aligned-count { font-size:12.5px; color: var(--muted); font-weight: 700; background: rgba(255,255,255,.02); padding: 4px 10px; border-radius: 6px; border: 1px solid var(--bd); text-transform: uppercase; }
  
  .bias-alert-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .bias-badge {
    font-size:13.5px;
    font-weight: 700;
    letter-spacing: 0.8px;
    padding: 4px 10px;
    border-radius: 6px;
    text-transform: uppercase;
  }
  .bias-badge.bull { color: #fff; background: var(--green); color: #0b0c10; }
  .bias-badge.bear { color: #fff; background: var(--red); }
  .bias-badge.neutral { color: var(--muted); background: rgba(139,148,158,.1); }
  .score-badge { font-size:24.0px; font-weight: 800; display: inline-flex; align-items: baseline; }
  .score-den { font-size:15.5px; color: var(--muted); font-weight: 500; margin-left: 2px; }

  .levels-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }
  .level-card {
    background: #0f1118;
    border: 1px solid var(--bd);
    border-radius: 8px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: relative;
    transition: all .2s;
  }
  .level-card:hover { border-color: #353945; }
  .level-card .level-label { font-size:11.5px; color: var(--muted); font-weight: 700; letter-spacing: .5px; }
  .level-card .level-verdict { font-size:15.5px; font-weight: 700; letter-spacing: .5px; }
  .level-card .level-verdict.BULL { color: var(--green); }
  .level-card .level-verdict.BEAR { color: var(--red); }
  .level-card .level-verdict.NEUTRAL { color: var(--muted); }
  
  .level-indicators {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
    font-size:12.5px;
    font-weight: 600;
  }
  .indicator-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #23262f; }
  .indicator-dot.green.active { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .indicator-dot.red.active { background: var(--red); box-shadow: 0 0 6px var(--red); }
  .indicator-val { font-size:12.5px; }
  .indicator-val.green-val { color: var(--muted); }
  .indicator-val.green-val.active { color: var(--green); }
  .indicator-val.red-val { color: var(--muted); }
  .indicator-val.red-val.active { color: var(--red); }
  .indicator-divider { color: var(--muted2); }

  .synthesis-details-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    border-top: 1px solid var(--bd);
    padding-top: 14px;
    margin-top: 14px;
  }
  .synthesis-detail-item { display: flex; flex-direction: column; gap: 4px; }
  .synthesis-detail-item .label { font-size:11.5px; color: var(--muted); font-weight: 700; letter-spacing: .8px; }
  .synthesis-detail-item .value { font-size:14.5px; font-weight: 600; }
  .synthesis-detail-item .value.calm { color: var(--green); }
  .synthesis-detail-item .value.warning { color: var(--orange); }
  .synthesis-detail-item .value.danger { color: var(--red); }
  
  .magnet-line {
    margin-top: 12px;
    font-size:13.5px;
    color: var(--muted);
    background: rgba(255,255,255,.01);
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px dashed var(--bd);
  }
  
  .sizing-line {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 12px;
  }
  .sizing-badge {
    background: var(--navy);
    border: 1px solid var(--blue);
    color: var(--blue);
    padding: 4px 10px;
    border-radius: 6px;
    font-size:12.5px;
    font-weight: 700;
    letter-spacing: .5px;
    text-transform: uppercase;
  }
  .sizing-desc { font-size:13.5px; color: var(--text); font-weight: 500; }

  .convergence-info-line {
    margin-top: 12px;
    font-size:12.5px;
    color: var(--muted);
    font-style: italic;
  }

  .asset-icon { margin-right: 6px; font-size:15.5px; display: inline-block; }

  /* grid */
  .grid {
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 20px;
    align-items: start;
  }
  /* La section microstructure et la methodo doivent prendre toute la largeur,
     sinon elles tombent dans les cases de la grille 2 colonnes (= les "trous"). */
  .grid>.section-label,.grid>.grid3,.grid>.metho{grid-column:1 / -1;}
  /* La colonne de droite (Inversion + Structure) est plus courte : on etire
     sa derniere carte pour qu'elle remplisse la hauteur de la colonne de gauche. */
  .grid>.col:last-child{height:100%;}
  .grid>.col:last-child .card:last-child{flex:1 1 auto;}
  .grid>.col:last-child .card:last-child .chart-wrap{flex:1 1 auto;height:auto;min-height:170px;}
  .col {
    display: flex;
    flex-direction: column;
    gap: 20px;

<script>
let activeCategory = 'Macro';
let activeGroup = null;

function getMarketStatus(assetId) {
  if (assetId === 'BTC' || assetId === 'ETH') {
    return { status: 'MARCHE OUVERT', class: 'open' };
  }
  const now = new Date();
  const est = new Date(now.toLocaleString("en-US", {timeZone: "America/New_York"}));
  const day = est.getDay();
  const hour = est.getHours();
  const min = est.getMinutes();
  const isWeekday = day >= 1 && day <= 5;
  const totalMinutes = hour * 60 + min;
  const isOpen = isWeekday && totalMinutes >= (9*60 + 30) && totalMinutes <= (16*60);
  return isOpen ? { status: 'MARCHE OUVERT', class: 'open' } : { status: 'MARCHE FERME', class: 'closed' };
}

function switchCategory(cat) {
  activeCategory = cat;
  const isCrypto = a => a.cat ? a.cat==='crypto' : (a.id==='BTC'||a.id==='ETH');
  const filtered = allAssets.filter(a => cat==='Crypto' ? isCrypto(a) : !isCrypto(a));
  if(cat==='Macro'){
    const cur = allAssets.find(a=>a.id===current);
    activeGroup = (cur && !isCrypto(cur)) ? (cur.group||null) : null;
  }
  if(filtered.length>0 && !filtered.some(a=>a.id===current)) current=filtered[0].id;
  renderAssets();
  load();
}

let charts = {};
function destroyCharts(){ Object.values(charts).forEach(c=>c&&c.destroy()); charts={}; }

const ASSETS_FALLBACK=[{id:"BTC",label:"BTC"},{id:"ETH",label:"ETH"},{id:"SPX",label:"S&P 500"},{id:"NDX",label:"Nasdaq 100"}];
let current="BTC";
let signMode=null;          // null = mode du reglage moteur ; sinon force par le bouton
let activeSignMode="fixed"; // mode reellement applique au dernier chargement

let allAssets = [];

async function loadAssets(){
  let list=ASSETS_FALLBACK;
  try{ const r=await fetch('/api/assets'); if(r.ok) list=await r.json(); }catch(e){}
  allAssets = list;
  
  // Auto-set activeCategory based on loaded current asset
  const _cur = allAssets.find(a => a.id === current);
  const isCrypto = _cur ? (_cur.cat === 'crypto') : (current === 'BTC' || current === 'ETH');
  activeCategory = isCrypto ? 'Crypto' : 'Macro';

  renderAssets();
}

function pcrRead(pcr){
  const a = allAssets.find(x=>x.id===current);
  const crypto = a && a.cat==='crypto';
  if(crypto){
    if(pcr < 0.5)   return {cls:'bull', txt:'<b>'+pcr+'</b> nettement sous la base crypto (~0.6) &rarr; calls dominants, biais haussier'};
    if(pcr <= 0.85) return {cls:'',     txt:'<b>'+pcr+'</b> proche de la base crypto (~0.6) &rarr; <b>normal</b>, pas de signal directionnel'};
    if(pcr <= 1.1)  return {cls:'bear', txt:'<b>'+pcr+'</b> au-dessus de la base &rarr; demande de protection put, défensif'};
    return {cls:'bear', txt:'<b>'+pcr+'</b> &gt; 1 (rare en crypto) &rarr; très défensif, souvent contrarian'};
  }
  if(pcr < 0.9)   return {cls:'bull', txt:'<b>'+pcr+'</b> sous la base indice (~1.1) &rarr; positionnement optimiste'};
  if(pcr <= 1.3)  return {cls:'',     txt:'<b>'+pcr+'</b> dans la zone normale indice (~1.1, hedging habituel)'};
  return {cls:'bear', txt:'<b>'+pcr+'</b> élevé &rarr; couverture défensive marquée'};
}

function iconFor(a){
  const cr = { BTC:['₿','#f7931a'], ETH:['Ξ','#627eea'], SOL:['◎','#14f195'], XRP:['X','#8fa0b8'], AVAX:['▲','#e84142'], TRX:['T','#ff5a5a'], HYPE:['H','#4fd1c5'] };
  if(cr[a.id]) return cr[a.id];
  const gc = { 'Indices US':'#5b8def','ETF larges':'#2dd4ff','Secteurs':'#c084fc','International':'#4fd1c5','Matières premières':'#fbbf24','Devises':'#4ade80','Taux / oblig':'#94a3b8' };
  const color = gc[a.group] || '#7e8aa0';
  const tk = String(a.ticker||a.id||'?');
  return [tk.charAt(0).toUpperCase(), color];
}

function crossCheckLink(id){
  const a = allAssets.find(x=>x.id===id);
  const tk = (a && a.ticker) ? a.ticker : id;
  if(a && a.cat==='crypto'){
    const c = tk.toLowerCase();
    let L = [];
    if(tk==='BTC'||tk==='ETH') L.push('<a href="https://cryptogamma.io" target="_blank" rel="noopener">CryptoGamma</a>');
    L.push('<a href="https://app.laevitas.ch/assets/options/gex/'+c+'/deribit" target="_blank" rel="noopener">Laevitas</a>');
    return L.join(' \u00b7 ') + ' <span style="color:#5b6478">(m\u00eames donn\u00e9es Deribit que toi)</span>';
  }
  const isIdx = {SPX:1,NDX:1,RUT:1,VIX:1,DJX:1}[tk];
  const fa = 'https://flashalpha.com/stock/'+tk.toLowerCase();
  const bc = isIdx ? 'https://www.barchart.com/stocks/quotes/$'+tk+'/gamma-exposure'
                   : 'https://www.barchart.com/etfs-funds/quotes/'+tk+'/gamma-exposure';
  return '<a href="'+fa+'" target="_blank" rel="noopener">FlashAlpha</a> \u00b7 '
       + '<a href="'+bc+'" target="_blank" rel="noopener">Barchart</a>';
}

function renderAssets(){
  const subBox=document.getElementById('subtabs');
  const box=document.getElementById('assets');
  box.innerHTML=''; if(subBox) subBox.innerHTML='';
  const isCrypto = a => a.cat ? a.cat==='crypto' : (a.id==='BTC'||a.id==='ETH');
  const filtered = allAssets.filter(a => activeCategory==='Crypto' ? isCrypto(a) : !isCrypto(a));
  document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.cat===activeCategory));
  const statusBox=document.getElementById('market-status');
  function refreshStatus(){ const si=getMarketStatus(current); if(statusBox){ statusBox.className='market-status '+si.class; statusBox.innerHTML='\u2022 '+si.status; } }
  refreshStatus();
  function makeChip(a){
    const b=document.createElement('span');
    b.className='ab'+(a.id===current?' on':''); b.dataset.id=a.id;
    const ic = iconFor(a);
    b.innerHTML = '<span class="asset-ic-circle" style="background:'+ic[1]+'">'+ic[0]+'</span>'+a.label;
    b.onclick=()=>{ current=a.id; renderAssets(); refreshStatus(); load(); };
    return b;
  }
  if(activeCategory==='Crypto'){
    if(subBox) subBox.style.display='none';
    filtered.forEach(a=>box.appendChild(makeChip(a)));
    return;
  }
  if(subBox) subBox.style.display='flex';
  const groups={}, order=[];
  filtered.forEach(a=>{ const g=a.group||'Autres'; if(!groups[g]){groups[g]=[];order.push(g);} groups[g].push(a); });
  if(!activeGroup || !groups[activeGroup]) activeGroup = order[0];
  order.forEach(g=>{
    const t=document.createElement('span');
    t.className='subtab'+(g===activeGroup?' on':'');
    t.textContent=g;
    t.onclick=()=>{ activeGroup=g; renderAssets(); };
    if(subBox) subBox.appendChild(t);
  });
  (groups[activeGroup]||[]).forEach(a=>box.appendChild(makeChip(a)));
}

async function load(fresh){
  destroyCharts();
  document.getElementById('content').innerHTML='<div class="loading">'+(fresh?'Récupération des dernières données pour ':'Interrogation de ')+current+'…</div>';
  try{
    const dteOv=getDteOverride(current);
    const params=[];
    if(dteOv) params.push('dte='+dteOv);
    if(fresh) params.push('fresh=1');
    if(signMode) params.push('sign='+signMode);
    const r=await fetch('/api/'+current+(params.length?('?'+params.join('&')):''));
    const d=await r.json();
    if(d.error){ document.getElementById('content').innerHTML='<div class="err">Erreur : '+d.error+'</div>'; return; }
    window.__lastData=d;
    render(d);
    updateSignToggle(d);
  }catch(e){
    document.getElementById('content').innerHTML='<div class="err">Serveur injoignable : '+e+'</div>';
  }
}
function updateSignToggle(d){
  var el=document.getElementById('signToggle');
  if(!el) return;

  el.style.display='inline-flex'; el.style.alignItems='center'; el.style.gap='8px';
  el.style.cursor='default'; el.onclick=null;

  // Le tape est une information affich\u00e9e \u00e0 c\u00f4t\u00e9, jamais un pilote des chiffres.
  var noteTxt, noteCol, noteBg;
  if(ds.tape_suggests_flip){ noteTxt='tape '+(ds.tape_days||'?')+'j \u2260'; noteCol='#ff9f1c'; noteBg='rgba(255,159,28,.10)'; }
  else if(ds.tape_days){ noteTxt='tape '+ds.tape_days+'j \u2713'; noteCol='#00ff87'; noteBg='rgba(0,255,135,.10)'; }
  else if(d && d.is_crypto===false){ noteTxt='standard indices'; noteCol='#8b949e'; noteBg='rgba(255,255,255,.04)'; }
  else { noteTxt='standard'; noteCol='#8b949e'; noteBg='rgba(255,255,255,.04)'; }
  el.innerHTML = '<span style="color:#8b949e;font-weight:600;">Signe</span>'
    + '<span style="padding:2px 8px;border-radius:5px;background:rgba(0,210,255,.12);color:#00d2ff;font-weight:700;">fixe</span>'
    + '<span style="font-size:12px;color:'+noteCol+';background:'+noteBg+';padding:2px 6px;border-radius:5px;font-weight:700;">'+noteTxt+'</span>';
  el.title = (ds.reason||'convention fixe')
    + (ds.tape_note ? ' \u2014 ' + ds.tape_note + (ds.tape_suggests_flip ? ' (le flux client sugg\u00e8re l\u2019inverse : \u00e0 surveiller, non appliqu\u00e9)' : ' (coh\u00e9rent avec la convention)') : '')
    + '. Les chiffres GEX/DEX suivent la convention fixe, comparable \u00e0 Laevitas / CryptoGamma / SpotGamma.';
}

  const _dexRatio = Math.min(1, _dexNow/_dexRef);
  const _dexHalf = 5 + 22*Math.sqrt(_dexRatio);            // demi-largeur 5%..27% (plus discrète)
  const _dexPos  = d.dex_total_musd>=0 ? 50 : (50 - _dexHalf);
  const dirClass = c.direction==='HAUSSIER'?'bull':c.direction==='BAISSIER'?'bear':'neutral';

        <p>Cet outil reproduit honnêtement la <b>couche options publique</b> de l'analyse de positionnement. Voici ce qu'il fait et ce qu'il ne fait pas.</p>
        <h4>Données utilisées aujourd'hui</h4>

        <h4>Ce qui est fiable</h4>

function drawGex(d){
  // --- Binning : on regroupe les strikes en ~40 tranches épaisses (comme la vidéo)
  // au lieu d'afficher 140+ barres fines. On somme le GEX dans chaque tranche.
  const raw0=d.gex_by_strike;
  if(!raw0.length){return;}
  // On resserre l'affichage autour du spot (~±20%) pour des barres lisibles, comme
  // les outils pros : au-delà, le GEX est quasi nul et n'ajoute que du bruit.
  // (Le zoom/pan reste dispo pour explorer plus loin.)
  const _bandOv=(typeof getBandOverride==='function')?getBandOverride(current):null;
  const BAND=_bandOv || (d.display_band!=null?d.display_band:0.20);
  const loK=d.spot*(1-BAND), hiK=d.spot*(1+BAND);
  let raw=raw0.filter(x=>x.strike>=loK && x.strike<=hiK);
  if(raw.length<3) raw=raw0;                       // garde-fou : pas assez de strikes -> tout afficher
  const ks=raw.map(x=>x.strike);
  const lo=Math.min(...ks), hi=Math.max(...ks);
  // Pas "rond" basé sur l'espacement réel des strikes (≈1000 sur BTC, natif sur les indices),
  // au lieu de forcer 40 tranches. On regroupe seulement s'il y aurait trop de barres.
  const sorted=[...ks].sort((a,b)=>a-b), gaps=[];
  for(let i=1;i<sorted.length;i++){const g=sorted[i]-sorted[i-1];if(g>0)gaps.push(g);}
  gaps.sort((a,b)=>a-b);
  const nativeStep = gaps.length ? gaps[Math.floor(gaps.length/2)] : Math.max((hi-lo)/40,1); // espacement médian
  let step = nativeStep;
  // Regroupement = MULTIPLE ENTIER de l'espacement natif des strikes (x1 = un strike
  // par barre, x2 = deux strikes fusionnés...). Raisonner en multiple et non en "nombre
  // de barres" garantit un effet visible même quand peu de strikes sont affichés.
  const _grp = (typeof getGexGroup==='function') ? getGexGroup() : 1;
  step = nativeStep * Math.max(1, _grp);
  while((hi-lo)/step > 110) step*=2;                       // garde-fou auto (max ~110)
  const bins={};
  raw.forEach(x=>{
    const b=Math.round((x.strike-lo)/step)*step+lo;
    bins[b]=(bins[b]||0)+x.gex_musd;
  });
  // Tranches VIDES incluses à 0 : une tranche sans strike doit s'afficher comme un
  // creux, pas comme un trou dans le graphe (barres régulières et continues).
  const nb=Math.round((hi-lo)/step);
  for(let i=0;i<=nb;i++){ const b=lo+i*step; if(bins[b]===undefined) bins[b]=0; }
  const entries=Object.entries(bins).map(([k,v])=>[+k,v]).sort((a,b)=>a[0]-b[0]);
  const binPrices=entries.map(e=>e[0]);
  const fmtK = k => k>=10000 ? '$'+(k/1000).toFixed(k%1000?1:0)+'K' : '$'+Math.round(k).toLocaleString('fr-FR');
  const everyN = Math.max(1, Math.ceil(binPrices.length/12));   // ~12 labels réguliers en bas
  const labels=entries.map(e=>fmtK(e[0]));
  const vals=entries.map(e=>e[1]);
  const colors=vals.map(v=>v>=0?'#5b8def':'#e0524f');
  // Clip de l'axe au 95e percentile pour rester lisible si une tranche domine.
  const absSorted=vals.map(Math.abs).sort((a,b)=>a-b);
  const p95=absSorted[Math.floor(absSorted.length*0.95)]||Math.max(...absSorted,1);
  const cap=p95*1.2;
  // Plugin : lignes verticales aux niveaux cles (spot / max pain / gamma flip).
  const levelLines={
    id:'levelLines',
    afterDatasetsDraw(chart){
      const {ctx,chartArea:{top,bottom,left,right}}=chart;
      if(hi<=lo) return;
      const xs=chart.scales.x;
      const n=binPrices.length;
      if(n<2) return;
      // index fractionnaire en interpolant le prix dans la liste reelle des tranches
      const idxFor=p=>{
        if(p<=binPrices[0]) return 0;
        if(p>=binPrices[n-1]) return n-1;
        for(let k=0;k<n-1;k++){
          if(p>=binPrices[k] && p<=binPrices[k+1]){
            const f=(p-binPrices[k])/((binPrices[k+1]-binPrices[k])||1);
            return k+f;
          }
        }
        return n-1;
      };
      const xFor=p=>xs.getPixelForValue(idxFor(p));
      const line=(p,color)=>{
        if(p==null) return;
        const x=xFor(p);
        if(x<left-2||x>right+2) return;
        ctx.save();
        ctx.strokeStyle=color; ctx.lineWidth=1.4; ctx.setLineDash([5,4]); ctx.globalAlpha=.9;
        ctx.beginPath(); ctx.moveTo(x,top); ctx.lineTo(x,bottom); ctx.stroke();
        ctx.restore();
      };
      line(d.spot,'#e6e8ee');
      line(d.max_pain,'#f0a325');
      line(d.gamma_flip,'#b06cf0');
    }
  };
  if(charts.gex){ try{ charts.gex.destroy(); }catch(e){} charts.gex=null; }   // sinon Chart.js refuse de redessiner
  charts.gex=new Chart(document.getElementById('gexChart'),{
    type:'bar',
    plugins:[levelLines],
    data:{labels,datasets:[{data:vals,backgroundColor:colors,borderWidth:0,barPercentage:.9,categoryPercentage:1}]},
    options:{responsive:true,maintainAspectRatio:false,
      interaction:{intersect:false,mode:'index'},
      plugins:{legend:{display:false},zoom:{zoom:{wheel:{enabled:true},pinch:{enabled:true},mode:'x'},pan:{enabled:true,mode:'x'},limits:{x:{minRange:3}}},tooltip:{
        backgroundColor:'#161922',borderColor:'#2a2e3a',borderWidth:1,padding:10,displayColors:false,
        callbacks:{title:i=>'Strike ~'+i[0].label,
        label:i=>'GEX '+(i.raw>=0?'+':'')+i.raw.toLocaleString('fr-FR',{maximumFractionDigits:0})+' M$'
                 +(Math.abs(i.raw)>cap?'  (tranche dominante)':'')}}},
      scales:{y:{min:-cap,max:cap,grid:{color:GRID},border:{display:false},
          ticks:{callback:v=>(Math.abs(v)>=1000?(v/1000).toFixed(1)+'Md':Math.round(v)+'M')+'$'}},
        x:{grid:{display:false},border:{color:'#23262f'},
          ticks:{maxRotation:0,autoSkip:false,font:{size:11,weight:'600'},color:'#aab2c0',
                 callback:(val,idx)=> (idx%everyN===0)? labels[idx] : ''}}}}});
}

const zeroLine = {
  id:'zeroLine',
  afterDraw(chart){
    const ys = chart.scales.y || chart.scales.yD; if(!ys) return;
    const y0 = ys.getPixelForValue(0);
    const a = chart.chartArea; if(!a) return;
    if(y0 < a.top || y0 > a.bottom) return;
    const ctx = chart.ctx;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(a.left, y0);
    ctx.lineTo(a.right, y0);
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = 'rgba(150,160,175,0.6)';
    ctx.setLineDash([]);
    ctx.stroke();
    ctx.restore();
  }
};

const INFO = {
  gex:{t:"GEX — Gamma Exposure (Exposition Gamma)",s:"Le coeur du dashboard. Indique si les dealers stabilisent ou amplifient le marche.",calc:"Pour chaque option : gamma x open interest x taille du contrat x prix au carre x 0.01. Les calls comptent en positif, les puts en negatif (convention de marche). On additionne tout, puis on regroupe par strike pour dessiner les barres.",use:"GEX positif = les dealers achetent les baisses et vendent les hausses, donc ils calment le marche (regime de range / ancrage). GEX negatif = ils font l'inverse et amplifient les mouvements (regime de cassure, plus volatil).",data:"Uniquement la chaine d'options (open interest reel + volatilite implicite reelle). Le gamma est calcule en modele Black-Scholes.",warn:"C'est un MODELE base sur l'hypothese que les dealers sont longs calls / courts puts. Si cette hypothese est fausse, le signe peut s'inverser. A lire comme un indicateur de positionnement, pas une verite.",play:"GEX positif = régime de RANGE : le prix est aimanté vers le max pain, les dealers amortissent → tu peux fader les extrêmes (vendre le haut, acheter le bas du range). GEX négatif = CASSURE : les moves s'auto-amplifient → joue le breakout dans le sens du mouvement, élargis tes stops, ne fade pas. Le GAMMA FLIP est le pivot : sous le flip = instable (cassure probable), au-dessus = stable (range). Les MURS de gamma (call/put) sont des aimants : sers-t'en comme cibles de prise de profit et comme niveaux de stop."},
  dex:{t:"DEX — Delta Exposure (Exposition Delta)",s:"Le biais directionnel net du book d'options.",calc:"Pour chaque option : delta x open interest x taille du contrat x prix. Le delta porte deja son signe (positif pour les calls, negatif pour les puts). On additionne tout.",use:"DEX positif = positionnement globalement haussier (plus de delta long que short). DEX negatif = positionnement baissier. C'est une photo du pari directionnel agrege.",data:"Chaine d'options (open interest + IV reels). Delta calcule en Black-Scholes.",warn:"Comme le GEX, c'est un modele de positionnement, pas une certitude sur ce que detiennent vraiment les acteurs.",play:"DEX négatif = les dealers doivent VENDRE du spot mécaniquement → pression baissière de fond. DEX positif = ils ACHÈTENT → soutien. Ce n'est pas un signal d'entrée seul : utilise-le pour confirmer ton biais et éviter de trader CONTRE le flux mécanique des dealers. Regarde surtout la TENDANCE dans l'historique : un DEX qui se dégrade jour après jour = pression vendeuse qui s'installe ; un DEX qui se redresse = le flux se retourne."},
  history:{t:"Historique DEX & GEX",s:"L'evolution jour apres jour du positionnement.",calc:"Chaque jour, le script enregistre un point : le DEX total et le GEX total du moment. Le graphe relie ces points. La ligne grise marque le niveau zero (au-dessus = positif, en dessous = negatif).",use:"Voir si le positionnement se renforce ou se retourne dans le temps. Une tendance qui passe de positif a negatif est un changement de regime a surveiller.",data:"Les snapshots quotidiens accumules localement (un point par jour, via le run quotidien).",warn:"L'historique se construit a partir d'aujourd'hui : il faut quelques semaines pour qu'il ressemble a la video. L'historique passe complet n'existe pas en gratuit."},
  rr:{t:"Risk Reversal 25 delta (Inversion de risque)",s:"Mesure si le marche paie plus cher pour se proteger a la baisse ou parier a la hausse.",calc:"On prend la volatilite implicite d'un call 25-delta moins celle d'un put 25-delta (memes echeances). Le resultat est positif ou negatif.",use:"Negatif = les puts sont plus chers que les calls, signe que les institutions paient pour se couvrir (peur / protection). Positif = appetit pour la hausse. On regarde l'echeance hebdo et mensuelle.",data:"Volatilite implicite reelle des options call et put proches du 25-delta.",warn:"Indicateur de sentiment derive des prix d'options, pas une prevision.",play:"RR très négatif = puts chers = peur / couverture institutionnelle massive. Deux lectures : soit un PLANCHER approche (quand tout le monde est couvert, il reste peu de vendeurs → rebond contrarian), soit ça CONFIRME un downtrend en cours. RR qui remonte vers 0 = la peur reflue → possible rebond. Compare HEBDO vs MENSUEL : hebdo nettement plus négatif que mensuel = stress de très court terme concentré (souvent un catalyseur imminent)."},
  term:{t:"Structure des echeances (Term structure)",s:"La forme de la courbe de volatilite implicite selon l'echeance.",calc:"On releve la volatilite implicite a la monnaie (ATM) pour chaque echeance disponible, puis on classe par nombre de jours. On regarde si la courbe monte (contango) ou descend (backwardation).",use:"Contango (court terme moins cher que long terme) = marche calme. Backwardation (court terme plus cher) = stress immediat. Le percentile IV situe la vol actuelle par rapport a son historique.",data:"Volatilite implicite ATM par echeance + historique d'IV accumule pour le percentile.",warn:"Le percentile depend de la longueur d'historique disponible : plus il y a de jours, plus il est fiable.",play:"CONTANGO (courbe montante, vol courte < vol longue) = marché calme → favorable au range et aux stratégies qui vendent de la vol courte. BACKWARDATION (courbe descendante, front > back) = stress immédiat anticipé → attends-toi à des moves brutaux, évite de vendre de la vol, privilégie l'achat de protection. Le IV PERCENTILE complète : élevé = vol chère (plutôt vendeur de vol), bas = vol bradée (plutôt acheteur de vol / options pas chères pour parier sur un move)."},
  charm:{t:"Forecast Dealer 24h — Charm & Vanna",s:"Les achats/ventes que les dealers vont faire mecaniquement, sans que le prix bouge.",calc:"Charm = variation du delta du book due au simple passage du temps (ramenee a 24h). Vanna = variation du delta si la volatilite implicite monte de 1 point. Pour chaque option on calcule ces sensibilites (Black-Scholes), on les multiplie par l'open interest et le prix, avec le signe dealer, et on additionne.",use:"Anticiper le flux force : meme si rien ne se passe, les dealers doivent rebalancer leur couverture. Charm dit ce qu'ils feront avec le temps, Vanna ce qu'ils feront si la vol bouge.",data:"Chaine d'options (open interest + IV reels). Greeks calcules en Black-Scholes.",warn:"Modele base sur la convention de signe dealer. C'est un ordre de grandeur de structure, pas une garantie."},
  vrp:{t:"Volatility Risk Premium (Prime de risque de volatilite)",s:"Est-ce que les options sont cheres ou bradees ?",calc:"VRP = volatilite implicite (IV, ce que le marche anticipe) moins volatilite realisee (RV, ce qui s'est reellement passe sur 30 jours).",use:"VRP positif = les options sont cheres (l'assurance coute plus que le risque reel) : avantage aux vendeurs d'options. VRP negatif = options bradees : avantage aux acheteurs.",data:"IV reelle issue des options. La RV necessite l'historique des prix spot.",warn:"La vol realisee n'est pas encore branchee (DONNEE MANQUANTE) : il faut accumuler l'historique des prix ou le brancher sur Deribit."},
  smile:{t:"Smile de volatilite & Put/Call",s:"Structure complete de la peur/euphorie + sentiment.",calc:"Smile : IV de chaque strike de l echeance la plus proche (puts OTM sous le spot, calls OTM au-dessus). Put/Call : somme open interest des puts / somme open interest des calls.",use:"Le smile montre ou le marche price le risque : pente forte cote puts = couverture chere = peur. POUR LE PUT/CALL : au-dessus de 1 = plus de puts que de calls = sentiment prudent/defensif ; en-dessous de 1 = plus de calls = appetit haussier. Nuance : un ratio extreme est souvent contrarian (trop de peur = plancher proche, trop d euphorie = sommet proche).",data:"Chaine d options de l echeance proche (Deribit ou CBOE).",warn:"Sur peu de strikes (petits ETF) le smile est pauvre. Le PCR sur OI ne distingue pas couverture et speculation."},
  gprofile:{t:"Profil de gamma cumule",s:"La structure complete du gamma, pas juste le point de flip.",calc:"Pour chaque niveau de prix hypothetique du spot, on recalcule le GEX total des dealers (somme des gammas x OI). On obtient une courbe.",use:"La courbe traverse zero au gamma flip. Au-dessus de zero (gamma positif) les dealers amortissent : le prix a tendance a coller, range. En-dessous (gamma negatif) ils amplifient : les mouvements s emballent, volatilite. Plus la pente est raide pres du spot, plus le basculement est brutal.",data:"Chaine d options (gamma, OI) re-evaluee a chaque niveau de prix.",warn:"Suppose le positionnement dealer habituel (longs calls/courts puts). Si l hypothese est fausse, le signe s inverse."},
  levels:{t:"Niveaux cles : spot, max pain, gamma flip",s:"A quoi servent ces 3 niveaux et ce qui se passe quand le prix les touche.",calc:"Spot = prix actuel. Max pain = strike ou le plus d options expirent sans valeur (la ou la douleur des acheteurs est maximale). Gamma flip = prix ou le GEX total bascule de positif a negatif.",use:"SPOT vs MAX PAIN : en regime de range (gamma+), le prix est souvent aimante vers le max pain a l approche de l expiration. SPOT vs GAMMA FLIP : au-dessus du flip = zone amortie (dealers stabilisent) ; en-dessous = zone amplifiee (dealers accelerent les mouvements). Franchir le flip change le regime. Les MURS (call/put) sont les plus gros strikes de gamma : ils agissent comme aimants/barrieres ou la volatilite se calme.",data:"Tous derives de la chaine d options.",warn:"Le max pain est une tendance statistique d expiration, pas une garantie. Le gamma flip depend de l hypothese de positionnement dealer."},
  maxpain:{t:"Migration du max pain",s:"Ou se deplace l aimant jour apres jour.",calc:"Max pain = strike ou le plus d options (calls+puts) expirent sans valeur. On le stocke chaque jour et on le trace contre le spot.",use:"En regime de range (gamma+), le prix a tendance a etre aimante vers le max pain a l approche de l echeance. Si le max pain monte jour apres jour et que le spot suit, le pinning haussier se confirme. Un grand ecart spot/max pain = tension qui peut se resorber vers le max pain.",data:"Stocke par daily.py, par horizon.",warn:"Tendance statistique d expiration, pas une garantie. Plus fiable proche de l echeance et en gamma positif."},
  pro:{t:"Lecture pro — flux & régime",s:"Les indicateurs que regarde un desk pro, au-dela du GEX brut.",calc:"GEX par 1% = dollars que les dealers doivent hedger pour 1% de move (unite standard SpotGamma/Tier1Alpha). Vol trigger = niveau exact ou le gamma net des dealers change de signe (zero interpole du profil de gamma). Flux charm/vanna OPEX = delta a re-hedger sur la prochaine grosse echeance, par jour (charm, passage du temps) et par +1 point d IV (vanna). Skew par terme = RR 25-delta sur court/mensuel/trimestriel.",use:"GEX/1% : plus c est gros, plus le hedging dealer est lourd autour du spot. Vol trigger : spot au-dessus = regime de range (vol etouffee) ; en-dessous = cassures (vol amplifiee) ; surveiller la traversee. Charm/vanna OPEX : moteur des vanna rallies et du pin d OPEX — un gros flux positif pousse mecaniquement le spot vers les gros strikes a l approche de l echeance. Skew par terme : si le court est bien plus negatif que le long, la peur est concentree court terme (catalyseur imminent) ; si c est uniforme, c est structurel.",data:"Tout calcule en direct sur la chaine d options (greeks Black-Scholes reels).",warn:"Comme le reste, repose sur l hypothese de positionnement dealer. Le charm/vanna suppose les dealers longs gamma au-dessus du flip. A croiser, jamais isole."},
  skewhist:{t:"Historique du skew (Risk Reversal)",s:"L evolution de la peur/euphorie dans le temps.",calc:"RR 25-delta = IV du call 25d moins IV du put 25d, stocke chaque jour. Negatif = puts plus chers (couverture/peur) ; positif = calls plus chers (euphorie).",use:"Voir le skew se creuser (de plus en plus negatif) = la peur monte, les institutions paient pour se proteger -> prudence. Le skew qui se detend (remonte vers 0 ou positif) = appetit de risque qui revient. C est un thermometre de sentiment dans le temps, pas un timing precis.",data:"Stocke par daily.py, par horizon (le skew court terme reagit plus vite que le trimestriel).",warn:"Depend de la qualite des IV (bruitees en tres court terme). A lisser avec une surface de vol pour etre parfaitement propre."},
  matrix:{t:"Matrice de scenarios — flow de hedge",s:"Combien les dealers achetent ou vendent en spot pour chaque mouvement du prix.",calc:"Pour chaque variation simulee (-10% a +10%), on recalcule le delta total du book a ce nouveau prix, et on regarde de combien la couverture des dealers doit changer. Positif = ils achetent, negatif = ils vendent.",use:"Voir si les dealers vont amplifier ou freiner un mouvement. En GEX negatif (short gamma) ils achetent les hausses et vendent les baisses (ca accelere). En GEX positif ils font l'inverse (ca freine, range).",data:"Chaine d'options (open interest + IV reels), delta recalcule en Black-Scholes a chaque niveau de prix.",warn:"Mecanique pure du modele : suppose la meme volatilite et la convention de signe dealer."},
  l1:{t:"Niveau 1 — Regime",s:"Le marche stabilise-t-il ou amplifie-t-il ?",calc:"Lit le signe et la force du GEX total, et la position du spot par rapport au gamma flip.",use:"Donne le decor general : range/ancrage (GEX positif) ou cassure/volatilite (GEX negatif). C'est le niveau le plus structurant de la synthese.",data:"GEX total + gamma flip, derives de la chaine d'options."},

  l3:{t:"Niveau 3 — Structure",s:"Que dit la courbe de volatilite ?",calc:"Lit la structure des echeances (contango / backwardation) et le percentile d'IV.",use:"Situe le stress dans le temps : tension immediate ou marche calme, et si la vol est chere ou pas par rapport a son historique.",data:"IV par echeance + historique d'IV."},

function showTradePlan(){
  const d=window.__lastData; if(!d) return;
  const c=d.convergence||{};
  const U=v=>(v==null?'—':'$'+Math.round(v).toLocaleString('fr-FR'));
  const fM=v=>{const s=v>=0?'+':'-';const a=Math.abs(v);return a>=1000?s+(a/1000).toLocaleString('fr-FR',{maximumFractionDigits:2})+' B$':s+a.toLocaleString('fr-FR',{maximumFractionDigits:1})+' M$';};
  const gexNeg=d.gex_total_musd<0;
  const W=d.gamma_walls||{};
  const regime = gexNeg
    ? `<b>CASSURE</b> (gamma négatif) — les dealers amplifient les mouvements. Volatilité attendue, un move peut s'auto-entretenir. On suit les cassures, on ne les fade pas.`
    : `<b>RANGE</b> (gamma positif) — les dealers absorbent. Prix aimanté vers le max pain ${U(d.max_pain)}. On fade les extrêmes vers le centre.`;
  let lvls=[`Spot <b>${U(d.spot)}</b>`];
  if(W.call_wall) lvls.push(`Mur call ${U(W.call_wall)} — résistance / cible haute`);
  if(W.put_wall) lvls.push(`Mur put ${U(W.put_wall)} — support / cible basse`);
  if(d.gamma_flip!=null) lvls.push(`Gamma flip ${U(d.gamma_flip)} — bascule range/cassure${d.flip_vs_spot_pct!=null?` (spot ${Math.abs(d.flip_vs_spot_pct).toFixed(1)}% ${d.flip_vs_spot_pct>0?'sous':'au-dessus'})`:''}`);
  if(d.max_pain!=null) lvls.push(`Max pain ${U(d.max_pain)} — aimant en régime de range`);
  if(d.expected_move) lvls.push(`Expected move ±${d.expected_move.pct}% → ${U(d.expected_move.low)} – ${U(d.expected_move.high)} d'ici ${d.expected_move.days}j`);
  let pos=[`DEX ${fM(d.dex_total_musd)} — dealers ${d.dex_total_musd<0?'vendent':'achètent'} du spot (flux ${d.dex_flux||'—'})`];
  if(d.rr_weekly!=null) pos.push(`Risk reversal ${d.rr_weekly} — ${d.rr_weekly<-1?'puts chers : peur / couverture':d.rr_weekly>1?'calls chers : euphorie':'équilibré'}`);
  if(d.put_call) pos.push(`Put/Call ${d.put_call.pcr_oi} — ${d.put_call.pcr_oi>1?'plus de puts : prudent':'plus de calls : haussier'}`);
  if(d.iv_percentile!=null) pos.push(`IV percentile ${d.iv_percentile} — vol ${d.iv_percentile>70?'chère (plutôt vendeur de vol)':d.iv_percentile<30?'bradée (plutôt acheteur de vol)':'médiane'}`);
  if(d.term_regime) pos.push(`Structure : ${d.term_regime}`);
  if(d.funding) pos.push(`Funding 8h ${d.funding.rate_8h_pct>=0?'+':''}${d.funding.rate_8h_pct}% — ${d.funding.rate_8h_pct>=0?'longs paient (reversal baissier si extrême)':'shorts paient (reversal haussier si extrême)'}`);
  const bias=c.direction||'NEUTRE';
  const emTxt=d.expected_move?`${U(d.expected_move.low)} – ${U(d.expected_move.high)}`:'—';
  const plan = gexNeg
    ? `Biais <b>${bias}</b> en régime de <b>cassure</b>. Tant que le spot reste sous le flip ${U(d.gamma_flip)}, le risque penche à la baisse et les moves seront amplifiés. À surveiller : cassure du mur put ${U(W.put_wall)} (accélération baissière) ou reprise au-dessus du flip (retour au calme). Cadre tes objectifs et stops dans la fourchette d'expected move ${emTxt}.`
    : `Biais <b>${bias}</b> en régime de <b>range</b>. Le prix devrait graviter vers le max pain ${U(d.max_pain)}, entre le mur put ${U(W.put_wall)} et le mur call ${U(W.call_wall)}. Stratégie de range : vendre près du mur call, acheter près du mur put, dans la limite de l'expected move ${emTxt}.`;
  let o=document.getElementById('infoOverlay');
  if(!o){ o=document.createElement('div'); o.id='infoOverlay'; o.className='info-overlay'; o.addEventListener('click',e=>{if(e.target===o)closeInfo();}); document.body.appendChild(o); }
  const dirClass=c.score>1?'bull':c.score<-1?'bear':'';
  let h=`<div class="info-modal trade-modal"><span class="iclose" onclick="closeInfo()">&times;</span>`;
  h+=`<h3>📊 Plan du jour — ${d.label}</h3>`;
  h+=`<div class="tp-bias">Biais <b class="${dirClass}">${bias}</b> · conviction ${c.conviction||'—'} · score <b>${c.score>0?'+':''}${c.score}</b>/10 · stress ${c.stress_label||'—'} ${c.stress!=null?c.stress+'/10':''}</div>`;
  h+=`<div class="tp-sec"><div class="tp-h">Régime</div><div class="tp-tx">${regime}</div></div>`;
  h+=`<div class="tp-sec"><div class="tp-h">Niveaux clés</div><ul class="tp-list">${lvls.map(x=>'<li>'+x+'</li>').join('')}</ul></div>`;
  h+=`<div class="tp-sec"><div class="tp-h">Positionnement & sentiment</div><ul class="tp-list">${pos.map(x=>'<li>'+x+'</li>').join('')}</ul></div>`;
  h+=`<div class="tp-sec tp-plan"><div class="tp-h">Le plan</div><div class="tp-tx">${plan}</div></div>`;
  h+=`<div class="play-disc">Synthèse éducative agrégée de tes indicateurs — pas un conseil financier. Rappel : le GEX/DEX repose sur une hypothèse (inventaire dealers non public), le signe peut être faux. À croiser avec le prix et le contexte.</div>`;
  h+=`</div>`;
  o.innerHTML=h; o.classList.add('open');
}

function _commitSettings(){
  const s=getSettings(); s.dte=s.dte||{}; s.band=s.band||{};
  const dteDef = window.__lastData && window.__lastData.dte_default ? Math.round(window.__lastData.dte_default) : 14;
  const bandDef = window.__lastData && window.__lastData.display_band ? Math.round(window.__lastData.display_band*100) : 20;
  const g=id=>{const e=document.getElementById(id); return e?parseInt(e.value):NaN;};
  const dte=g('setDte'), bars=g('setBars'), hist=g('setHist'), band=g('setBand');
  if(dte && dte!==dteDef) s.dte[current]=dte; else delete s.dte[current];
  if(bars && bars!==110) s.bars=bars; else delete s.bars;
  if(hist && hist!==7) s.histDays=hist; else delete s.histDays;
  if(band && band>=1 && band!==bandDef) s.band[current]=band/100; else delete s.band[current];
  saveSettings(s);
}
function _refreshMaxBarsNote(){
  const el=document.getElementById('maxBarsNote'); const d=window.__lastData; if(!el||!d) return;
  const be=document.getElementById('setBand'); const band=be?parseInt(be.value):20;
  let maxN='?';
  if(d.gex_by_strike && d.spot){ const lo=d.spot*(1-band/100), hi=d.spot*(1+band/100); maxN=d.gex_by_strike.filter(x=>x.strike>=lo && x.strike<=hi).length; }
  let actual=null;
  try{ const c=Chart.getChart('gexChart'); if(c) actual=c.data.labels.length; }catch(e){}
  el.textContent = (actual!=null?actual+' barres affichées · ':'')+'max ~'+maxN+' (strikes réels dans la zone ±'+band+'%)';
}
let _liveTimer=null;
function applySettings(){ _commitSettings(); closeInfo(); load(true); }
function liveApply(refetch){
  _commitSettings();
  clearTimeout(_liveTimer);
  _liveTimer=setTimeout(()=>{ if(refetch) load(); else if(window.__lastData) render(window.__lastData); setTimeout(_refreshMaxBarsNote, refetch?500:30); }, refetch?60:140);
}
function resetSettings(){
  const s=getSettings(); if(s.dte) delete s.dte[current]; if(s.band) delete s.band[current]; if(s.preset) delete s.preset[current]; delete s.bars; delete s.histDays;
  saveSettings(s); closeInfo(); load();
}
// Profils prédéfinis par horizon. bandFactor = multiplicateur du zoom PAR DÉFAUT de
// l'actif (s'adapte donc crypto vs indice). dte en jours, hist en jours.
const PRESETS = {
  scalp:    {label:'⚡ Scalp (min)',     dte:1,  bandFactor:0.6, bars:160, hist:3,  note:'0DTE/échéance la plus proche, zoom serré sur les murs, granularité max.'},
  intraday: {label:'📈 Intraday (1-2j)', dte:2,  bandFactor:0.9, bars:120, hist:7,  note:'Positionnement immédiat, équilibre lisibilité/finesse.'},
  swing:    {label:'🗓️ Swing (1 sem)',   dte:7,  bandFactor:1.0, bars:90,  hist:14, note:'Vue 1 semaine, zoom par défaut.'},
  long:     {label:'🌐 Long terme',      dte:30, bandFactor:2.0, bars:60,  hist:30, note:'Échéances larges, zoom large, historique long.'}
};
function applyPreset(k){
  const pr=PRESETS[k]; if(!pr) return;
  const s=getSettings(); s.dte=s.dte||{}; s.band=s.band||{};
  const bandDef=(window.__lastData && window.__lastData.display_band) || 0.20;
  s.dte[current]=pr.dte;
  s.band[current]=Math.min(0.6, Math.max(0.01, +(bandDef*pr.bandFactor).toFixed(3)));
  s.bars=pr.bars; s.histDays=pr.hist;
  s.preset=s.preset||{}; s.preset[current]=k;      // mémorise le profil actif
  saveSettings(s); closeInfo(); load();
}

// Horizon choisi PAR compartiment (hist/maxpain/skew), totalement indépendants : changer

let HZSEL={hist:null, maxpain:null, skew:null};

  else if(which==='maxpain') drawMaxPainMigration(window.__lastData);
  else if(which==='skew') drawSkewHistory(window.__lastData);
}

function drawHistory(d){

  const body=document.getElementById('histBody'); if(!body) return;

    if(charts.histDex){charts.histDex.destroy(); charts.histDex=null;}

    body.innerHTML='<div style="color:var(--muted);padding:24px 4px;font-size:14px;">Historique <b>'+sel+'</b> en construction : '+(series?series.length:0)+' jour(s) enregistré(s). Le graphe apparaît à partir de 2 jours. Lance daily.py chaque jour pour le remplir.</div>';
    return;
  }
  body.innerHTML='<div class="hist-sub" style="color:#4f8cf0;">DEX · Exposition Delta <span style="color:var(--muted);font-weight:400;">· point coloré = biais du jour</span></div><div class="chart-wrap h150"><canvas id="histDex"></canvas></div><div class="hist-sub" style="margin-top:14px;color:#e8a93c;">GEX · Exposition Gamma</div><div class="chart-wrap h150"><canvas id="histGex"></canvas></div>';
  window.__hist = series;
  const fmt = v => { const a=Math.abs(v); return (a>=1000?(v/1000).toFixed(1)+'B':Math.round(v)+'M')+'$'; };
  const zeroDark = {
    id:'zeroDark',
    afterDraw(chart){
      const ys=chart.scales.y; if(!ys) return;

      ctx.restore();

        options:{responsive:true,maintainAspectRatio:false,interaction:{intersect:false,mode:'index'},
          plugins:{legend:{display:false},tooltip:{backgroundColor:'#161922',borderColor:'#2a2e3a',borderWidth:1,padding:11,displayColors:false,
            titleFont:{size:12,weight:'600'},titleColor:'#8a92a0',bodyFont:{size:14,weight:'700'},
            callbacks:{title:i=>hh[i[0].dataIndex].date,
              label:i=>{const x=hh[i.dataIndex]; const l=[(key==='dex'?'DEX ':'GEX ')+fmt(x[key])]; if(x.score!=null){const lab=x.score>0?'BULLISH':x.score<0?'BEARISH':'NEUTRE'; l.push(lab+' '+(x.score>0?'+':'')+x.score);} return l;}}}},
          scales:{y:{grid:{color:GRID},border:{display:false},ticks:{color:color,font:{size:10},callback:fmt}},
            x:{grid:{display:false},border:{color:'#23262f'},ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:8,font:{size:12,weight:'600'},color:'#9aa3b2'}}}}});
    };
    return render;
  }
  const rDex=mk('histDex','dex','#4f8cf0');
  const rGex=mk('histGex','gex','#e8a93c');

function drawGammaProfile(d){
  if(!d.gamma_profile || d.gamma_profile.length<3) return;
  if(charts.gammaProfile) charts.gammaProfile.destroy();
  const pts=d.gamma_profile;
  const labels=pts.map(p=>'$'+(p.price>=10000?Math.round(p.price/1000)+'K':Math.round(p.price)));
  const vals=pts.map(p=>p.gex_musd);

  // marqueur vertical au spot : barre fine via plugin
  const spotLine={id:'spotLine',afterDatasetsDraw(chart){
    const xs=chart.scales.x, a=chart.chartArea; if(!xs||!a) return;

    ctx.setLineDash([]);ctx.fillStyle='rgba(230,232,238,0.85)';ctx.font='10px sans-serif';ctx.fillText('spot',x+4,a.top+11);ctx.restore();
  }};
  const zeroDark={id:'zeroDark',afterDraw(chart){

    if(y0<a.top||y0>a.bottom)return;const ctx=chart.ctx;ctx.save();ctx.beginPath();ctx.moveTo(a.left,y0);ctx.lineTo(a.right,y0);
    ctx.lineWidth=1.6;ctx.strokeStyle='rgba(255,255,255,0.45)';ctx.stroke();ctx.restore();
  }};
  charts.gammaProfile=new Chart(document.getElementById('gammaProfileChart'),{
    type:'line', plugins:[zeroDark,spotLine],
    data:{labels,datasets:[{data:vals,borderColor:'#7be0b0',borderWidth:2,tension:.2,pointRadius:0,
      fill:{target:{value:0},above:'rgba(63,208,127,0.12)',below:'rgba(224,82,79,0.12)'},
      segment:{borderColor:ctx=>ctx.p1.parsed.y>=0?'#4fd08a':'#e0524f'}}]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{intersect:false,mode:'index'},
      plugins:{legend:{display:false},tooltip:{backgroundColor:'#161922',borderColor:'#2a2e3a',borderWidth:1,padding:10,displayColors:false,
        callbacks:{title:i=>labels[i[0].dataIndex],label:i=>'GEX '+(vals[i.dataIndex]>0?'+':'')+vals[i.dataIndex]+'M$'+(vals[i.dataIndex]>=0?' · amorti':' · amplifié')}}},
      scales:{y:{grid:{color:GRID},border:{display:false},ticks:{font:{size:10},callback:v=>(v>0?'+':'')+v+'M'}},
        x:{grid:{display:false},border:{color:'#23262f'},ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:9,font:{size:10}}}}}});
}

function drawSmile(d){
  if(!d.vol_smile || d.vol_smile.length<3) return;
  if(charts.smile) charts.smile.destroy();
  const labels=d.vol_smile.map(x=>'$'+(x.strike>=10000?Math.round(x.strike/1000)+'K':x.strike));
  const vals=d.vol_smile.map(x=>x.iv);
  const spot=d.spot;
  // index du strike le plus proche du spot (pour marquer l'ATM)
  let atmI=0,best=1e18; d.vol_smile.forEach((x,i)=>{const dd=Math.abs(x.strike-spot); if(dd<best){best=dd;atmI=i;}});
  const ptCol=d.vol_smile.map((x,i)=> i===atmI?'#fff':(x.strike<spot?'#e0524f':'#4f8cf0'));
  charts.smile=new Chart(document.getElementById('smileChart'),{
    type:'line',
    data:{labels,datasets:[{data:vals,borderColor:'#b98be0',backgroundColor:'transparent',borderWidth:2,
      pointRadius:d.vol_smile.map((x,i)=>i===atmI?5:3),pointBackgroundColor:ptCol,pointBorderColor:'#0e1016',pointBorderWidth:1,tension:.35}]},
    options:{responsive:true,maintainAspectRatio:false,
      interaction:{intersect:false,mode:'index'},
      plugins:{legend:{display:false},tooltip:{
        backgroundColor:'#161922',borderColor:'#2a2e3a',borderWidth:1,padding:10,displayColors:false,
        callbacks:{title:i=>labels[i[0].dataIndex]+(i[0].dataIndex===atmI?' (≈ ATM)':''),
          label:i=>'IV '+vals[i.dataIndex]+'%'}}},
      scales:{y:{grid:{color:GRID},border:{display:false},ticks:{callback:v=>v+'%',font:{size:10}}},
        x:{grid:{display:false},border:{color:'#23262f'},ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:9,font:{size:10}}}}}});
}

function setGlow(score, cls){
  const el=document.getElementById('feGlow'); if(!el) return;
  const rgb = cls==='bull'?'55,201,120' : cls==='bear'?'255,59,92' : '120,128,140';
  const a = Math.max(0.04, Math.min(0.19, Math.abs(score)/10*0.19));
  el.style.background='linear-gradient(180deg, rgba('+rgb+','+a.toFixed(3)+') 0%, rgba('+rgb+',0) 100%)';
}

function _spark(scores){
  if(!scores.length) return '';
  const w=120,h=26,n=scores.length,lo=-10,hi=10;
  const X=i=> n<=1?w/2 : (i/(n-1))*w;
  const Y=v=> h-((v-lo)/(hi-lo))*h;
  const pts=scores.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
  const last=scores[scores.length-1];
  const col=last>0.5?'#37c978':last<-0.5?'#ff3b5c':'#9aa1ad';
  const y0=Y(0).toFixed(1);
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" style="overflow:visible">'
    +'<line x1="0" y1="'+y0+'" x2="'+w+'" y2="'+y0+'" stroke="rgba(255,255,255,.18)" stroke-width="1"/>'
    +'<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
    +'<circle cx="'+X(n-1).toFixed(1)+'" cy="'+Y(last).toFixed(1)+'" r="2.5" fill="'+col+'"/></svg>';
}

function drawNarrative(d){
  const box=document.getElementById('narrativeBox'); if(!box) return;
  // Pas de sélecteur propre : toujours l'horizon par défaut du moteur, jamais celui
  // choisi dans un des trois graphiques ci-dessous (compartiments indépendants).
  const s=_histSeriesFor(d,null).filter(x=>x.score!=null);
  if(s.length<1){ box.innerHTML=''; return; }
  const sign=v=>v>0.5?1:v<-0.5?-1:0;
  const today=s[s.length-1].score;
  const yest=s.length>=2?s[s.length-2].score:null;
  const delta=yest!=null?+(today-yest).toFixed(1):null;
  const word=v=>v>0.5?'haussier':v<-0.5?'baissier':'neutre';
  const wcol=v=>v>0.5?'#37c978':v<-0.5?'#ff3b5c':'#9aa1ad';
  let streak=1; const cur=sign(today);
  for(let i=s.length-2;i>=0;i--){ if(cur!==0 && sign(s[i].score)===cur) streak++; else break; }
  const last7=s.slice(-7);
  const tDelta = last7.length>=2 ? Math.abs(last7[last7.length-1].score)-Math.abs(last7[0].score) : 0;
  const trend = Math.abs(tDelta)<1 ? 'STABLE' : tDelta>0 ? 'RENFORCEMENT' : 'AFFAIBLISSEMENT';
  const tcol = trend==='RENFORCEMENT'?'#f5a623':trend==='AFFAIBLISSEMENT'?'#5b8cff':'#9aa1ad';
  const dtxt = delta==null?'—':(delta>0?'+':'')+delta+' pt'+(Math.abs(delta)>=2?'s':'');
  // Diff par composant L1-L5 vs hier (si les verdicts sont stockés)
  const LBL={L1_REGIME:'L1 Régime',L2_POSITIONING:'L2 Positioning',L3_STRUCTURE:'L3 Structure',L4_LIQUIDITE:'L4 Liquidité',L5_CATALYST:'L5 Catalyst'};
  const vc=v=>v==='BULL'?'#37c978':v==='BEAR'?'#ff3b5c':'#9aa1ad';
  let changes=[], hasLevels=false;
  if(s.length>=2){
    const tl=s[s.length-1].levels||{}, yl=s[s.length-2].levels||{};
    for(const k in LBL){
      if(tl[k]||yl[k]) hasLevels=true;
      if(tl[k]&&yl[k]&&tl[k]!==yl[k]) changes.push(`${LBL[k]} <span style="color:var(--faint)">${yl[k]} →</span> <b style="color:${vc(tl[k])}">${tl[k]}</b>`);
    }
  }
  const changedRow = !hasLevels ? ''
    : `<div class="narr-changed"><span class="narr-changed-lbl">Ce qui a changé :</span> ${changes.length? changes.join('<span class="narr-sep">·</span>') : '<span style="color:var(--faint)">aucun composant n\u0027a bougé vs hier</span>'}</div>`;
  const hierTxt = yest==null
    ? `<span style="color:var(--muted)">Pas encore d'hier — la narrative se construit à partir du 2ᵉ jour.</span>`
    : `Hier <b style="color:${wcol(yest)}">${yest>0?'+':''}${yest}</b> <span style="color:var(--muted)">→</span> aujourd'hui <b style="color:${wcol(today)}">${today>0?'+':''}${today}</b> <span class="nb-delta" style="color:${delta>0?'#37c978':delta<0?'#ff3b5c':'#9aa1ad'}">(${dtxt})</span>`;
  box.innerHTML=`
    <div class="narrbox">
      <div class="narr-main">
        <div class="narr-line">${hierTxt}</div>
        <div class="narr-sub">
          <span class="narr-chip">${streak} jour${streak>1?'s':''} consécutif${streak>1?'s':''} <b style="color:${wcol(today)}">${word(today)}</b></span>
          <span class="narr-chip">Tendance 7j : <b style="color:${tcol}">${trend}</b></span>
        </div>
        ${changedRow}
      </div>
      <div class="narr-spark"><span class="narr-spark-lbl">7 derniers scores</span>${_spark(last7.map(x=>x.score))}</div>
    </div>`;
}

function skewTermRead(st){
  if(!st || !st.length) return '';
  const c=st.find(x=>x.label==='court'), t=st.find(x=>x.label==='trimestriel');
  if(!c || !t || c.rr==null || t.rr==null) return '<span style="color:var(--faint)">Structure incomplète (données d\u0027échéance manquantes).</span>';
  const d=c.rr - t.rr;   // court - trimestriel
  if(d < -2) return 'Peur concentrée sur le <b style="color:#ff3b5c">court terme</b> — typique d\u0027un catalyseur imminent (le court terme paie nettement plus pour se couvrir).';
  if(d > 2)  return 'Inquiétude surtout sur le <b style="color:#f5a623">long terme</b> — le court terme est plus serein que le trimestriel.';
  return 'Skew <b>homogène</b> sur les échéances — peur structurelle, pas d\u0027événement court terme particulier.';
}

function feGauge(score, cls){
  const col = cls==='bull'?'#37c978':cls==='bear'?'#ff3b5c':'#9aa1ad';
  const r=64,cx=80,cy=80,a0=Math.PI,a1=0;
  const t=Math.max(0,Math.min(1,(score+10)/20));
  const ang=a0+(a1-a0)*t;
  const nx=cx+Math.cos(ang)*(r-9), ny=cy-Math.sin(ang)*(r-9);
  const arc=(p0,p1)=>{const A=a0+(a1-a0)*p0,B=a0+(a1-a0)*p1;return 'M '+(cx+Math.cos(A)*r)+' '+(cy-Math.sin(A)*r)+' A '+r+' '+r+' 0 0 1 '+(cx+Math.cos(B)*r)+' '+(cy-Math.sin(B)*r);};
  const txt=(score>0?'+':'')+score;
  // viewBox plus haut : le chiffre va EN BAS (y=114), sous le pivot (cy=80). L'aiguille reste
  // dans la moitie haute (elle ne descend jamais sous cy), donc le nombre est toujours degage.
  return '<svg width="172" height="126" viewBox="0 0 160 126">'
    +'<defs><linearGradient id="feg" x1="0" x2="1"><stop offset="0" stop-color="#ff3b5c"/><stop offset=".5" stop-color="#6b7280"/><stop offset="1" stop-color="#37c978"/></linearGradient></defs>'
    +'<path d="'+arc(0,1)+'" stroke="#1e2533" stroke-width="11" fill="none" stroke-linecap="round"/>'
    +'<path d="'+arc(0,1)+'" stroke="url(#feg)" stroke-width="11" fill="none" stroke-linecap="round" opacity=".9"/>'
    +'<line x1="'+cx+'" y1="'+cy+'" x2="'+nx+'" y2="'+ny+'" stroke="'+col+'" stroke-width="3.5" stroke-linecap="round"/>'
    +'<circle cx="'+cx+'" cy="'+cy+'" r="5.5" fill="#0e1016" stroke="'+col+'" stroke-width="2.5"/>'
    +'<text x="'+cx+'" y="116" text-anchor="middle" font-family="ui-monospace,SF Mono,monospace" font-size="30" font-weight="700" fill="'+col+'">'+txt+'</text>'
    +'</svg>';
}

function drawScoreGauge(score, cls){
  const el=document.getElementById('scoreGauge'); if(!el) return;
  const ctx=el.getContext('2d');
  const cx=48,cy=48,r=38,lw=8;
  const col=cls==='bull'?'#3fb27f':cls==='bear'?'#e0524f':'#9aa1ad';
  ctx.clearRect(0,0,96,96);
  // demi-cercle de fond
  ctx.beginPath();ctx.arc(cx,cy,r,Math.PI*0.75,Math.PI*2.25);ctx.lineWidth=lw;ctx.strokeStyle='#23202a';ctx.lineCap='round';ctx.stroke();
  // arc proportionnel à |score|/10
  const frac=Math.min(1,Math.abs(score)/10);
  const start=Math.PI*0.75, end=start+frac*(Math.PI*1.5);
  ctx.beginPath();ctx.arc(cx,cy,r,start,end);ctx.lineWidth=lw;ctx.strokeStyle=col;ctx.lineCap='round';ctx.stroke();
}

function drawIvpGauge(ivp){
  const ctx=document.getElementById('ivpGauge').getContext('2d');
  const cx=35,cy=35,r=28,lw=6; const pct=(ivp??0)/100;
  ctx.clearRect(0,0,70,70);
  ctx.beginPath();ctx.arc(cx,cy,r,0,2*Math.PI);ctx.lineWidth=lw;ctx.strokeStyle='#23202a';ctx.stroke();
  const col=pct>0.66?'#e0524f':pct>0.33?'#f0a325':'#3fb27f';
  ctx.beginPath();ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+pct*2*Math.PI);ctx.lineWidth=lw;ctx.strokeStyle=col;ctx.lineCap='round';ctx.stroke();
}

document.getElementById('refresh').onclick=load;
loadAssets().then(load);
</script>
